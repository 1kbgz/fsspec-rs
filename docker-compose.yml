# MinIO local S3-compatible service for benchmarks and integration tests.
#
# With podman (no compose needed):
#   make minio-start              # start MinIO + create bucket
#   make minio-stop               # stop MinIO
#
# With docker compose:
#   docker compose up -d          # start MinIO
#   docker compose down           # stop MinIO
#
# MinIO console: http://localhost:9001  (minioadmin / minioadmin)
# S3 endpoint:   http://localhost:9000

services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot container to create the benchmark bucket on startup
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/benchmark
      "
