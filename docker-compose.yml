# MinIO local S3-compatible service for benchmarks and integration tests.
#
# With podman (no compose needed):
#   make minio-start              # start MinIO + create bucket
#   make minio-stop               # stop MinIO
#
# With docker compose:
#   docker compose up -d          # start MinIO
#   docker compose down           # stop MinIO
#
# MinIO console: http://localhost:9001  (minioadmin / minioadmin)
# S3 endpoint:   http://localhost:9000

services:
  minio:
    # docker.io/minio/minio is no longer published; this image bundles the server and mc.
    image: docker.io/bitnamilegacy/minio:2025.5.24
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: benchmark
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
