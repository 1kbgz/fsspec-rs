[package]
name = "fsspec_rs_py"
version = "0.2.2"
edition = "2021"
publish = false

[lib]
name = "fsspec_rs"
path = "rust/python/lib.rs"
crate-type = ["cdylib"]

[dependencies]
fsspec_rs = { path = "./rust", version = "*" }
fsspec_rs_bridge = { path = "./rust/bridge", version = "*" }
fsspec_sys = { path = "./rust/sys", version = "*", optional = true }
pyo3 = { version = "0.30.1", features = ["abi3", "extension-module", "multiple-pymethods"] }

# hatch-rs selects the route from HATCH_RS_LIBRARY_SOURCE: `capi` links the
# shared libfsspec, `direct` compiles the backends and registry in.
[features]
default = ["direct"]
capi = ["dep:fsspec_sys"]
direct = []

[profile.release]
panic = 'abort'
lto = true
