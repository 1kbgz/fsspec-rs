[package]
name = "fsspec_rs_bridge"
version = "0.2.0"
authors = ["the fsspec-rs authors <dev@1kbgz.com>"]
edition = "2021"
license = "Apache-2.0"
readme = "../../README.md"
repository = "https://github.com/1kbgz/fsspec-rs"
description = "Python fsspec bridge for the fsspec-rs Rust traits"

[lib]
name = "fsspec_rs_bridge"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
fsspec_rs = { path = "..", version = "0.2.0" }
pyo3 = { version = "0.30.1" }

[dev-dependencies]
tempfile = "3"
