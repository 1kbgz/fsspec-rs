[package]
name = "fsspec_rs"
version = "0.3.0"
authors = ["the fsspec-rs authors <dev@1kbgz.com>"]
edition = "2021"
license = "Apache-2.0"
readme = "../README.md"
repository = "https://github.com/1kbgz/fsspec-rs"
description = "fsspec-compatible backends with Rust acceleration"

[lib]
name = "fsspec_rs"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
object_store = { version = "0.14", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"], optional = true }
futures-util = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }
bytes = "1"
sha2 = "0.10"
url = "2"
percent-encoding = "2"

[features]
default = ["s3"]
# Runtime-backed object adapters; disabling all default features preserves the wasm build.
object-store = ["dep:object_store", "dep:tokio", "dep:futures-util", "dep:async-trait"]
# S3Fs and the `s3` registry protocol.
s3 = ["object-store", "object_store/aws"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[workspace]
members = [
    ".",
    "bridge",
    "capi",
    "sys",
]

[[example]]
name = "object_store_bridge"
required-features = ["object-store"]
