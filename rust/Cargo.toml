[package]
name = "fsspec_rs"
version = "0.2.1"
authors = ["the fsspec-rs authors <dev@1kbgz.com>"]
edition = "2021"
license = "Apache-2.0"
readme = "../README.md"
repository = "https://github.com/1kbgz/fsspec-rs"
description = "fsspec-compatible backends with Rust acceleration"

[lib]
name = "fsspec_rs"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
object_store = { version = "0.14", features = ["aws"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"], optional = true }
bytes = "1"
url = "2"
percent-encoding = "2"

[features]
default = ["s3"]
# S3Fs and the `s3` registry protocol. Without it the crate builds for wasm32-unknown-unknown.
s3 = ["dep:object_store", "dep:tokio"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[workspace]
members = [
    ".",
    "bridge",
    "capi",
    "sys",
]
