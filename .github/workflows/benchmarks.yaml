name: Benchmarks

on:
  push:
    branches:
      - main
    paths:
      - 'fsspec_rs/benchmarks/**'
      - 'fsspec_rs/**/*.py'
      - 'rust/src/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions-ext/python/setup@main

      - uses: actions-ext/rust/setup@main

      - name: Install dependencies
        run: make develop

      - name: Run quick benchmarks
        run: make benchmark-local-quick

      - name: Compare with main
        if: github.event_name == 'pull_request'
        run: |
          python -m asv continuous --config fsspec_rs/benchmarks/asv.conf.json --verbose main HEAD || true

      - name: Publish benchmark HTML
        if: github.ref == 'refs/heads/main'
        run: make benchmark-publish

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            .asv/results/
            docs/html/benchmarks/
        if: always()
